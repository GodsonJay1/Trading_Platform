version: '3.8'
services:
  db:
    image: mysql:8
    container_name: trading-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trust_trading
    volumes:
      - db_data:/var/lib/mysql

  cache:
    image: memcached:latest
    container_name: trading-cache
    ports:
      - "11211:11211"

  mq:
    image: rabbitmq:3-management
    container_name: trading-mq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test

  backend:
    image: godsonjay1/trading-backend:latest
    container_name: trading-backend
    build: ./trading
    depends_on:
      - db
      - cache
      - mq
    ports:
      - "5455:5455"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/trust_trading
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      MEMCACHED_ACTIVE_HOST: cache
      MEMCACHED_ACTIVE_PORT: 11211
      RABBITMQ_ADDRESS: mq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: test
      RABBITMQ_PASSWORD: test

  web:
    image: nginx:latest
    container_name: trading-web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  db_data:
